<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Shop</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
    header { background: #222; color: white; padding: 8px 24px; }
    .layout { display: flex; gap: 24px; padding: 24px; flex-wrap: wrap; }
    .products {
      flex: 3; min-width: 280px; display: grid; align-content: start; gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    }
    .card { background: white; border-radius: 8px; padding: 16px; text-align: center; }
    .emoji { font-size: 48px; }
    .cart { flex: 1; min-width: 260px; background: white; border-radius: 8px; padding: 16px; align-self: flex-start; }
    .cart-row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; gap: 8px; }
    button { padding: 6px 10px; cursor: pointer; }
    input[type="text"] { width: 100%; padding: 8px; margin: 8px 0; }
    #message { margin-top: 12px; font-weight: bold; }
    .error { color: #b00020; }
    .success { color: #1b7f3b; }
  </style>
</head>
<body>
  <header><h1>My Shop</h1></header>

  <div class="layout">
    <div class="products" id="products"></div>

    <div class="cart">
      <h2>Your Cart</h2>
      <div id="cartItems"></div>
      <p><strong>Total: <span id="total">$0.00</span></strong></p>
      <input type="text" id="customerName" placeholder="Your name" />
      <button onclick="checkout()">Place order</button>
      <div id="message"></div>
    </div>
  </div>

  <script>
    let products = [];  // filled from the backend
    let cart = {};      // { productId: quantity }

    // Small helpers
    function money(cents) {
      return "$" + (cents / 100).toFixed(2);
    }
    function el(tag, text, className) {
      const e = document.createElement(tag);
      if (text) e.textContent = text;
      if (className) e.className = className;
      return e;
    }

    // Ask the backend for the products
    async function loadProducts() {
      const response = await fetch("/api/products");
      products = await response.json();
      showProducts();
      showCart();
    }

    // Draw the product cards
    function showProducts() {
      const box = document.getElementById("products");
      box.innerHTML = "";
      products.forEach(function (p) {
        const card = el("div", "", "card");
        card.appendChild(el("div", p.emoji, "emoji"));
        card.appendChild(el("h3", p.name));
        card.appendChild(el("p", money(p.price_cents)));
        const button = el("button", "Add to cart");
        button.onclick = function () { changeQty(p.id, 1); };
        card.appendChild(button);
        box.appendChild(card);
      });
    }

    // Add (+1) or remove (-1) one of a product
    function changeQty(id, change) {
      cart[id] = (cart[id] || 0) + change;
      if (cart[id] <= 0) delete cart[id];
      showCart();
    }

    // Draw the cart and the total
    function showCart() {
      const box = document.getElementById("cartItems");
      box.innerHTML = "";
      let total = 0;

      const ids = Object.keys(cart);
      if (ids.length === 0) {
        box.appendChild(el("p", "Your cart is empty."));
      }

      ids.forEach(function (id) {
        const p = products.find(function (x) { return x.id === Number(id); });
        const qty = cart[id];
        total += p.price_cents * qty;

        const row = el("div", "", "cart-row");
        row.appendChild(el("span", p.emoji + " " + p.name + " × " + qty));

        const controls = el("span");
        const minus = el("button", "−");
        minus.onclick = function () { changeQty(p.id, -1); };
        const plus = el("button", "+");
        plus.onclick = function () { changeQty(p.id, 1); };
        controls.appendChild(minus);
        controls.appendChild(plus);

        row.appendChild(controls);
        box.appendChild(row);
      });

      document.getElementById("total").textContent = money(total);
    }

    // Send the order to the backend
    async function checkout() {
      const message = document.getElementById("message");
      const name = document.getElementById("customerName").value;

      const items = Object.keys(cart).map(function (id) {
        return { id: Number(id), qty: cart[id] };
      });

      const response = await fetch("/api/orders", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name, items: items })
      });
      const data = await response.json();

      if (!response.ok) {
        message.className = "error";
        message.textContent = data.error;
        return;
      }

      message.className = "success";
      message.textContent = "Order #" + data.orderId + " placed! Total: " + money(data.total_cents);
      cart = {};
      document.getElementById("customerName").value = "";
      showCart();
    }

    loadProducts();
  </script>
</body>
</html>
